name: Scrape and extract

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraper mode: recent | backfill'
        required: false
        default: 'recent'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build scraper jar
        run: mvn -B -DskipTests package
      - name: Scrape Reddit
        run: java -jar target/ib-api-scraper.jar --source=reddit --mode=${{ inputs.mode || 'recent' }}
      - name: Scrape GFG
        run: java -jar target/ib-api-scraper.jar --source=gfg --mode=${{ inputs.mode || 'recent' }}
      - name: Extract structured data
        run: java -jar target/ib-api-scraper.jar --mode=extract --batch=100
